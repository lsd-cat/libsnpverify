name: ci
on:
  push:
  pull_request:
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ts/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: ts/playwright-report }
  kotlin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: kotlin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck detekt test --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: kotlin-test-results, path: kotlin/build/reports }
